
<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StarStep | Exploración lunar</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/juego.css') }}">

<body>

    <main class="contenedor">

        <header>
            <p>OUTSTRIP</p>
            <h1>STARSTEP</h1>

        <nav class="navegacion">
            <a href="{{ url_for('inicio') }}">

            </a>

    <script type="module"
