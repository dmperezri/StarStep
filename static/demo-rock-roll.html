
<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>StarStep · Rock & Roll</title>

    <style>

        :root {
            --night: #0E1233;
            --panel: #1A1F4D;
            --raised: #262C66;
            --border: #1A1340;
            --cream: #FFF8E7;
            --soft: #B9BEE6;
            --mint: #8FF0D8;
            --violet: #ABA1F5;
            --purple: #6E62CE;
            --moon: #FFE066;
            --mars: #D9593A;
            --water: #3FD0E0;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            background: var(--night);
            color: var(--cream);
            font-family: "Courier New", monospace;
        }

        #stars {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            pointer-events: none;
        }

        .presentation {
            position: relative;
            min-height: 100svh;
            width: min(1200px, 94%);
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 20px 0;
        }

        .brand {
            color: var(--mint);
            font-weight: bold;
            font-size: .8rem;
            letter-spacing: 2px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        button, .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 10px 14px;
            background: var(--raised);
            color: var(--cream);
            font: bold .8rem "Courier New", monospace;
            text-decoration: none;
            border: 2px solid var(--violet);
            box-shadow: 4px 4px var(--border);
            cursor: pointer;
        }

        button:not(:disabled):hover,
        .button:hover {
            background: var(--purple);
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid var(--moon);
            outline-offset: 4px;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        button.active,
        button.primary {
            background: var(--mint);
            color: var(--night);
        }

        button.primary:not(:disabled):hover {
            background: var(--moon);
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px 0;
            gap: 22px;
        }

        .eyebrow {
            color: var(--violet);
            font-weight: bold;
            font-size: .85rem;
            letter-spacing: 5px;
        }

        /* PLANETAS */

        .worlds {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: min(780px, 100%);
            gap: 20px;
        }

        .planet {
            width: clamp(75px, 17vw, 185px);
            flex-shrink: 0;
            animation: float 5s steps(20) infinite;
        }

        .planet svg {
            display: block;
            width: 100%;
            filter: drop-shadow(5px 5px 0 #080A20);
        }

        .planet span {
            display: block;
            margin-top: 16px;
            font-size: clamp(.6rem, 1.2vw, .9rem);
            font-weight: bold;
        }

        .moon {
            color: var(--moon);
        }

        .mars {
            color: var(--water);
            animation-delay: -2s;
        }

        .connection {
            flex: 1;
            min-width: 20px;
            height: 2px;
            border-top: 3px dashed var(--purple);
            opacity: .7;
        }

        /* TÍTULO DEL CAPÍTULO */

        .chapter-title {
            margin: 0;
            color: var(--moon);
            font-size: clamp(2.1rem, 7vw, 5.5rem);
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow:
                3px 3px 0 var(--border),
                6px 6px 0 var(--purple);
        }

        .subtitle {
            color: var(--cream);
            line-height: 1.6;
            letter-spacing: 2px;
        }

        .reveal {
            animation: reveal .8s steps(12) both;
        }

        /* ACTOS */

        .acts {
            width: min(760px, 100%);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .act {
            background: var(--panel);
            border: 2px solid var(--purple);
            padding: clamp(10px, 2vw, 22px);
            box-shadow: 5px 5px var(--border);
        }

        .act strong {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .act span {
            display: block;
            font-size: .8rem;
            font-weight: bold;
        }

        .act:nth-child(1) {
            color: var(--moon);
            border-color: var(--moon);
        }

        .act:nth-child(2) {
            color: var(--water);
            border-color: var(--water);
        }

        .act:nth-child(3) {
            color: var(--violet);
            border-color: var(--violet);
        }

        /* LITO */

        .lito {
            width: 110px;
            animation: float 3s steps(15) infinite;
        }

        .lito svg {
            display: block;
            width: 100%;
        }

        .briefing {
            width: min(740px, 100%);
            background: var(--cream);
            color: var(--night);
            border: 3px solid var(--border);
            padding: 20px;
            text-align: left;
            box-shadow: 6px 6px var(--purple);
        }

        .briefing strong {
            color: #4F45A6;
            font-size: .8rem;
        }

        .briefing p {
            margin: 14px 0 5px;
            font-size: clamp(.85rem, 1.4vw, 1rem);
            line-height: 1.7;
            font-weight: bold;
        }

        /* CUENTA REGRESIVA */

        .countdown {
            font-size: clamp(5rem, 20vw, 12rem);
            font-weight: 900;
            color: var(--moon);
            text-shadow:
                5px 5px var(--border),
                9px 9px var(--purple);
        }

        .mission-button {
            width: min(340px, 100%);
            min-height: 50px;
        }

        /* PIE DE PÁGINA Y PROGRESO */

        footer {
            text-align: center;
            padding: 20px 0;
            color: var(--soft);
            font-size: .72rem;
        }

        #progress {
            width: min(350px, 90%);
            height: 8px;
            margin: 14px auto;
            display: block;
            appearance: none;
            border: 0;
            background: var(--panel);
        }

        #progress::-webkit-progress-bar {
            background: var(--panel);
        }

        #progress::-webkit-progress-value {
            background: var(--mint);
        }

        #progress::-moz-progress-bar {
            background: var(--mint);
        }

        .finished {
            background: var(--panel);
            border: 2px solid var(--mint);
            padding: 24px;
            line-height: 1.6;
            max-width: 600px;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body.paused * {
            animation-play-state: paused !important;
        }

        @media (max-width: 600px) {
            header {
                justify-content: center;
            }

            .brand {
                width: 100%;
                text-align: center;
            }

            .controls {
                justify-content: center;
            }

            .acts {
                gap: 6px;
            }

            .act span {
                font-size: .65rem;
            }

            .worlds {
                gap: 8px;
            }

            .chapter-title {
                letter-spacing: 0;
            }

            .briefing {
                padding: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

    </style>

</head>

<body>

    <script>

        "use strict";

        // ==========================================
        // TRADUCCIONES
        // ==========================================

        const translations = {

            es: {
                back: "VOLVER",
                chapter: "CAPÍTULO 01",
                subtitle: "DOS MUNDOS, DOS HISTORIAS",
                moon: "LUNA",
                mars: "MARTE",
                traces: "HUELLAS",
                moonLabel: "Luna",
                marsLabel: "Marte",

                speaker: "LITO · CONTROL DE MISIÓN",

                briefing:
                    "Cadete, nuestra misión es explorar dos mundos, " +
                    "investigar sus secretos y descubrir las huellas " +
                    "que la ciencia dejó en la Luna y Marte.",

                ready:
                    "Todo está preparado. " +
                    "Activaremos los sistemas de lanzamiento. " +
                    "¡La aventura comienza ahora!",

                next: "CONTINUAR",
                launch: "¡ESTOY LISTO!",
                pause: "PAUSA",
                resume: "REANUDAR",
                voiceOn: "VOZ ON",
                voiceOff: "VOZ OFF",
                liftoff: "¡DESPEGUE!",
                replay: "REPETIR PRESENTACIÓN",

                demoEnd:
                    "Aquí comenzará el minijuego del viaje espacial.",

                preview:
                    "VISTA DE DESARROLLO · NO MODIFICA TU PARTIDA",

                scenes: [
                    "DOS MUNDOS",
                    "ROCK & ROLL",
                    "TRES ACTOS",
                    "INSTRUCCIONES DE MISIÓN",
                    "PREPARACIÓN",
                    "CUENTA REGRESIVA",
                    "MISIÓN LISTA"
                ]
            },

            en: {
                back: "BACK",
                chapter: "CHAPTER 01",
                subtitle: "TWO WORLDS, TWO STORIES",
                moon: "MOON",
                mars: "MARS",
                traces: "TRACES",
                moonLabel: "Moon",
                marsLabel: "Mars",

                speaker: "LITO · MISSION CONTROL",

                briefing:
                    "Cadet, our mission is to explore two worlds, " +
                    "investigate their secrets and discover the " +
                    "traces science left on the Moon and Mars.",

                ready:
                    "Everything is ready. " +
                    "We will activate the launch systems. " +
                    "The adventure begins now!",

                next: "CONTINUE",
                launch: "I'M READY!",
                pause: "PAUSE",
                resume: "RESUME",
                voiceOn: "VOICE ON",
                voiceOff: "VOICE OFF",
                liftoff: "LIFTOFF!",
                replay: "REPLAY INTRODUCTION",

                demoEnd:
                    "The space travel minigame will begin here.",

                preview:
                    "DEVELOPMENT PREVIEW · DOES NOT MODIFY YOUR SAVE",

                scenes: [
                    "TWO WORLDS",
                    "ROCK & ROLL",
                    "THREE ACTS",
                    "MISSION BRIEFING",
                    "PREPARATION",
                    "COUNTDOWN",
                    "MISSION READY"
                ]
            }

        };

        let language = "es";
        let voiceEnabled = false;
        let paused = false;
        let scene = 0;

        // Duración en milisegundos.
        const durations = [
            3000,
            3000,
            5000,
            8000,
            0,
            3000,
            0
        ];

        let elapsed = 0;
        let lastTime = null;

        const $ = id => document.getElementById(id);

        const canSpeak =
            "speechSynthesis" in window &&
            "SpeechSynthesisUtterance" in window;

        const reducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        );

        // ==========================================
        // NARRACIÓN
        // ==========================================

        function stopVoice() {

            if (canSpeak) {
                window.speechSynthesis.cancel();
            }

        }

        function speak(text) {

            stopVoice();

            if (!voiceEnabled || !canSpeak || paused) {
                return;
            }

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.lang =
                language === "es" ? "es" : "en";

            speech.rate = .95;
            speech.pitch = 1.15;

            window.speechSynthesis.speak(speech);

        }

        function currentSpeech() {

            if (scene === 3) {
                return translations[language].briefing;
            }

            if (scene === 4) {
                return translations[language].ready;
            }

            return "";

        }

        // ==========================================
        // IDIOMA
        // ==========================================

        function updateLanguage() {

            const text = translations[language];

            document.documentElement.lang = language;

            document.querySelectorAll("[data-text]")
                .forEach(element => {

                    element.textContent =
                        text[element.dataset.text];

                });

            document.querySelectorAll("[data-label]")
                .forEach(element => {

                    element.setAttribute(
                        "aria-label",
                        text[element.dataset.label]
                    );

                });

            document.querySelectorAll("[data-lang]")
                .forEach(button => {

                    const active =
                        button.dataset.lang === language;

                    button.classList.toggle(
                        "active", active
                    );

                    button.setAttribute(
                        "aria-pressed",
                        String(active)
                    );

                });

            $("voiceButton").textContent =
                voiceEnabled
                    ? text.voiceOn
                    : text.voiceOff;

            $("voiceButton").setAttribute(
                "aria-pressed",
                String(voiceEnabled)
            );

            $("pauseButton").textContent =
                paused ? text.resume : text.pause;

            $("pauseButton").setAttribute(
                "aria-pressed",
                String(paused)
            );

            $("sceneLabel").textContent =
                text.scenes[scene];

            $("missionText").textContent =
                currentSpeech();

            $("progress").setAttribute(
                "aria-label",
                language === "es"
                    ? "Progreso de la presentación"
                    : "Introduction progress"
            );

        }

        // ==========================================
        // CONTROL DE ESCENAS
        // ==========================================

        function showScene(number) {

                stopVoice();

                // Entrar automáticamente al nivel de vuelo.
                if (number === 6) {

                    scene = 6;

                    window.location.replace(
                        "demo-vuelo.html?lang=" +
                        encodeURIComponent(language)
                    );

                    return;
                }

                scene = number;
                elapsed = 0;
                lastTime = null;
                paused = false;

            document.body.classList.remove("paused");

            $("worlds").hidden = scene > 2;

            $("titleBlock").hidden =
                scene < 1 || scene > 4;

            $("acts").hidden = scene !== 2;

            $("lito").hidden =
                scene !== 3 && scene !== 4;

            $("briefing").hidden =
                scene !== 3 && scene !== 4;

            $("nextButton").hidden = scene !== 3;
            $("nextButton").disabled = true;

            $("launchButton").hidden = scene !== 4;

            $("countdown").hidden = scene !== 5;
            $("countdown").textContent = "3";

            $("finished").hidden = scene !== 6;

            $("pauseButton").hidden =
                scene === 4 || scene === 6;

            $("progress").hidden =
                durations[scene] === 0;

            $("progress").value = 0;

            [
                "worlds",
                "titleBlock",
                "acts",
                "briefing"
            ].forEach(id => {

                const element = $(id);

                element.classList.remove("reveal");

                if (!element.hidden) {

                    void element.offsetWidth;

                    element.classList.add("reveal");

                }

            });

            updateLanguage();

            const speech = currentSpeech();

            if (speech) {
                speak(speech);
            }

        }

        // ==========================================
        // TEMPORIZADOR
        // ==========================================

        function updateScene(time) {

            if (lastTime === null) {
                lastTime = time;
            }

            const delta = Math.min(
                time - lastTime,
                100
            );

            lastTime = time;

            if (!paused && !document.hidden) {

                const duration = durations[scene];

                if (duration > 0) {

                    elapsed += delta;

                    $("progress").value =
                        Math.min(elapsed / duration, 1);

                    if (scene === 5) {

                        $("countdown").textContent =
                            String(
                                Math.max(
                                    1,
                                    Math.ceil(
                                        (duration - elapsed) / 1000
                                    )
                                )
                            );

                    }

                    if (elapsed >= duration) {

                        if (scene === 3) {

                            // El jugador confirma que
                            // terminó de leer las instrucciones.
                            $("nextButton").disabled = false;

                        } else {

                            showScene(scene + 1);

                        }

                    }

                }

            }

            requestAnimationFrame(updateScene);

        }

        // ==========================================
        // BOTONES
        // ==========================================

        document.querySelectorAll("[data-lang]")
            .forEach(button => {

                button.addEventListener("click", () => {

                    language = button.dataset.lang;

                    updateLanguage();

                    const speech = currentSpeech();

                    if (speech) {
                        speak(speech);
                    }

                });

            });

        $("voiceButton").disabled = !canSpeak;

        $("voiceButton").addEventListener("click", () => {

            voiceEnabled = !voiceEnabled;

            updateLanguage();

            const speech = currentSpeech();

            if (voiceEnabled && speech) {
                speak(speech);
            } else {
                stopVoice();
            }

        });

        $("pauseButton").addEventListener("click", () => {

            paused = !paused;

            document.body.classList.toggle(
                "paused", paused
            );

            lastTime = null;

            updateLanguage();

            if (paused) {

                stopVoice();

                $("nextButton").disabled = true;

            } else {

                const speech = currentSpeech();

                if (speech) {
                    speak(speech);
                }

            }

        });

        $("nextButton").addEventListener("click", () => {

            if (scene === 3 && !paused &&
                elapsed >= durations[3]) {

                showScene(4);

            }

        });

        $("launchButton").addEventListener("click", () => {

            if (scene === 4) {
                showScene(5);
            }

        });

        $("replayButton").addEventListener("click", () => {

            showScene(0);

        });

        document.addEventListener("visibilitychange", () => {

            lastTime = null;

            if (document.hidden) {
                stopVoice();
            }

        });

        window.addEventListener("pagehide", stopVoice);

        // ==========================================
        // FONDO ESPACIAL
        // ==========================================

        const canvas = $("stars");

        const ctx = canvas.getContext("2d");

        const stars = Array.from(
            { length: 170 },
            (_, i) => ({
                x: (i * 131 + 17) % 480,
                y: (i * 67 + 31) % 270,
                size: i % 13 === 0 ? 2 : 1
            })
        );

        let starTime = 0;

        function drawStars(time = 0) {

            if (!paused && !reducedMotion.matches) {
                starTime = time;
            }

            ctx.fillStyle = "#0E1233";
            ctx.fillRect(0, 0, 480, 270);

            stars.forEach((star, i) => {

                ctx.globalAlpha =
                    .4 + .6 *
                    ((Math.sin(starTime * .001 + i) + 1) / 2);

                ctx.fillStyle =
                    i % 7 === 0
                        ? "#8FF0D8"
                        : "#FFF8E7";

                ctx.fillRect(
                    star.x,
                    star.y,
                    star.size,
                    star.size
                );

            });

            ctx.globalAlpha = 1;

            requestAnimationFrame(drawStars);

        }

        // ==========================================
        // INICIO
        // ==========================================

        const initialLanguage =
    new URLSearchParams(window.location.search)
        .get("lang");

if (["es", "en"].includes(initialLanguage)) {
    language = initialLanguage;
}

const flightLink =
    document.getElementById("continueFlight");

flightLink.addEventListener("click", event => {

    event.preventDefault();

    if (scene !== 6) {
        return;
    }

    window.location.href =
        "demo-vuelo.html?lang=" +
        encodeURIComponent(language);

});

showScene(0);

requestAnimationFrame(updateScene);
requestAnimationFrame(drawStars);

    </script>

</body>
</html>
